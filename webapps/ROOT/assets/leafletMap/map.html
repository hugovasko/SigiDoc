<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
     integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI="
     crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"
     integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM="
     crossorigin="">
    </script>
    <title>Map</title>
</head>
<body>
    <div id="date-filter">
        <div id="date-filter-label">
            <strong id="date-filter-title">Date</strong>
            <span id="date-filter-range"></span>
        </div>
        <div id="date-filter-slider">
            <div id="date-filter-track"></div>
            <input id="date-from" type="range" aria-label="From year">
            <input id="date-to" type="range" aria-label="To year">
        </div>
        <span id="date-filter-count"></span>
        <button id="date-filter-reset" type="button">Reset</button>
    </div>
    <div id="map"></div>

    <script src="map.js"></script>
</body>
</html>
